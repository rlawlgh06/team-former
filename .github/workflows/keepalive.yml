name: DB 깨어 있게 하기

# Supabase 무료 프로젝트는 1주일 동안 DB 요청이 적으면 일시정지된다.
# 채점 기간에 일시정지되어 있으면 채점 자체가 불가능하므로(공고 6.3절 16번)
# 외부 예약 서비스로 매일 질의를 보낸다 (공고 3장 어려운 해결).

on:
  schedule:
    - cron: "0 3 * * *"      # 매일 UTC 03:00 = 한국 시각 정오
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "psycopg[binary]==3.3.6"

      - name: DB 에 질의 보내기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT count(*) FROM tf_students")
                  print("살아 있음. 학생 수:", cur.fetchone()[0])
          PY
